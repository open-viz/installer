{{- $root := . -}}
{{- $relay := .Values.alertmanagerWebhookRelay -}}
{{- $genericWebhookEnabled := and .Values.alertmanager.webhook.enabled .Values.alertmanager.webhook.url -}}
{{- $relayWebhookURLs := list -}}
{{- range $provider := list $relay.providers.googleChat $relay.providers.slack $relay.providers.msTeams $relay.providers.mattermost }}
  {{- if $provider.url }}
    {{- $relayWebhookURLs = append $relayWebhookURLs $provider.url -}}
  {{- end }}
{{- end }}
{{- $relayWebhookEnabled := and .Values.alertmanager.webhook.enabled (gt (len $relayWebhookURLs) 0) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring-operator.fullname" . }}-alertmanager-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring-operator.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      - name: alertmanager-receiver
        {{- if .Values.alertmanager.email.enabled }}
        emailConfigs:
          - to: {{ .Values.alertmanager.email.to | quote }}
            from: {{ .Values.alertmanager.email.from | quote }}
            smarthost: {{ .Values.alertmanager.email.smarthost | quote }}
            authUsername: {{ .Values.alertmanager.email.authUsername | quote }}
            authPassword:
              name: {{ include "monitoring-operator.fullname" . }}-alertmanager-email
              key: password
            requireTLS: {{ .Values.alertmanager.email.requireTLS }}
            sendResolved: {{ .Values.alertmanager.email.sendResolved }}
            headers:
              - key: Subject
                value: >-
{{ .Files.Get "files/alertmanager/email.subject.tmpl" | indent 18 }}
            text: |
{{ .Files.Get "files/alertmanager/email.text.tmpl" | indent 14 }}
            html: |
{{ .Files.Get "files/alertmanager/email.html.tmpl" | indent 14 }}
        {{- end }}
        {{- if or $genericWebhookEnabled $relayWebhookEnabled }}
        webhookConfigs:
          {{- if $genericWebhookEnabled }}
          - urlSecret:
              name: {{ include "monitoring-operator.fullname" $root }}-alertmanager-webhook
              key: url
            sendResolved: {{ $root.Values.alertmanager.webhook.sendResolved }}
          {{- end }}
          {{- if $relayWebhookEnabled }}
          - urlSecret:
              name: {{ include "monitoring-operator.fullname" $root }}-alertmanager-webhook
              key: relay-url
            sendResolved: {{ $relay.sendResolved }}
          {{- end }}
        {{- end }}
